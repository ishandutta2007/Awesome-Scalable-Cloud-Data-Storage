<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#7928ca" />
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowSoft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 18px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
    }
    .floating-card-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .pulse-circle {
      animation: pulse 4s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.25; }
      100% { transform: scale(1.15); opacity: 0.45; }
    }
  </style>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="16" />

  <!-- Animated Glowing Background Orbs (Non-obtrusive background) -->
  <g transform="translate(1050, 60)">
    <circle cx="0" cy="0" r="140" fill="#00f2fe" opacity="0.12" filter="url(#glowSoft)" class="pulse-circle" />
  </g>
  <g transform="translate(150, 300)">
    <circle cx="0" cy="0" r="120" fill="#7928ca" opacity="0.15" filter="url(#glowSoft)" class="pulse-circle" />
  </g>

  <!-- Background Grid Lines -->
  <g stroke="#334155" stroke-width="0.5" opacity="0.25">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Dynamic Network / Constellation in Background (Side Visuals) -->
  <g stroke="#38bdf8" stroke-width="1.5" opacity="0.35">
    <!-- Connecting lines -->
    <path d="M 880 70 L 980 120 L 1100 80 L 1050 200 L 930 180 Z" fill="none">
      <animate attributeName="stroke-dasharray" values="0,500; 500,0; 0,500" dur="8s" repeatCount="indefinite" />
    </path>
    <path d="M 980 120 L 1050 200 L 1120 260 L 990 280 L 930 180" fill="none">
      <animate attributeName="opacity" values="0.2; 0.5; 0.2" dur="6s" repeatCount="indefinite" />
    </path>

    <!-- Animated Data Pulses -->
    <circle cx="880" cy="70" r="5" fill="#38bdf8">
      <animate attributeName="r" values="4;7;4" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="980" cy="120" r="6" fill="#00f2fe" filter="url(#glow)">
      <animate attributeName="r" values="5;8;5" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="1100" cy="80" r="4" fill="#818cf8" />
    <circle cx="1050" cy="200" r="7" fill="#38bdf8">
      <animate attributeName="r" values="6;9;6" dur="3.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="930" cy="180" r="5" fill="#c084fc" />
    <circle cx="1120" cy="260" r="4" fill="#38bdf8" />
    <circle cx="990" cy="280" r="5" fill="#00f2fe" />
  </g>

  <!-- Floating Storage Metric / Architecture Badges on Right -->
  <g transform="translate(860, 220)">
    <animateTransform attributeName="transform" type="translate" values="860,220; 860,214; 860,220" dur="5s" repeatCount="indefinite" />
    <rect width="130" height="38" rx="19" fill="url(#pillGrad)" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="20" cy="19" r="6" fill="#10b981">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="24" class="floating-card-text">S3-Compatible</text>
  </g>

  <g transform="translate(1010, 140)">
    <animateTransform attributeName="transform" type="translate" values="1010,140; 1010,146; 1010,140" dur="6s" repeatCount="indefinite" />
    <rect width="140" height="38" rx="19" fill="url(#pillGrad)" stroke="#818cf8" stroke-width="1.2" opacity="0.9" />
    <circle cx="20" cy="19" r="6" fill="#38bdf8">
      <animate attributeName="opacity" values="1; 0.4; 1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="36" y="24" class="floating-card-text">Exabyte-Scale</text>
  </g>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g transform="translate(70, 52)">
    <rect width="250" height="32" rx="16" fill="#0369a1" fill-opacity="0.3" stroke="#0ea5e9" stroke-width="1" />
    <circle cx="18" cy="16" r="4" fill="#38bdf8">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="21" class="badge-text">CLOUD DATA STORAGE &amp; S3</text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title & Subtitle -->
  <!-- Crisp, fully readable, permanently in foreground -->
  <g transform="translate(70, 130)">
    <!-- Title with glowing gradient accent -->
    <text class="title-text">
      Awesome <tspan fill="url(#accentCyan)">Scalable Cloud Data Storage</tspan>
    </text>
    <text y="48" class="subtitle-text">
      The Ultimate Curated Directory of SaaS &amp; Open-Source Object Storage Platforms
    </text>
    <text y="76" class="subtitle-text" font-size="15px" fill="#64748b">
      Object Storage • Distributed Filesystems • High-Throughput S3 APIs • Self-Hosted Data Lakes
    </text>
  </g>

  <!-- Feature Tags Row in Foreground -->
  <g transform="translate(70, 260)">
    <!-- Tag 1 -->
    <g transform="translate(0, 0)">
      <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">⚡ Low-Latency Engines</text>
    </g>
    <!-- Tag 2 -->
    <g transform="translate(195, 0)">
      <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">🛡️ 99.999999999% Durability</text>
    </g>
    <!-- Tag 3 -->
    <g transform="translate(390, 0)">
      <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">🌐 Multi-Cloud &amp; Hybrid</text>
    </g>
    <!-- Tag 4 -->
    <g transform="translate(585, 0)">
      <rect width="185" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="16" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#cbd5e1">🚀 Zero-Egress Options</text>
    </g>
  </g>
</svg>
