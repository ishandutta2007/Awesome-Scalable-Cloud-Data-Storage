<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1b2a"/><stop offset="100%" stop-color="#1b263b"/></linearGradient><linearGradient id="accentCyan" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="accentPurple" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ff007f"/><stop offset="100%" stop-color="#7928ca"/></linearGradient><linearGradient id="pillGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="glowSoft" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="16"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{transform:scale(1);opacity:.25}}.badge-text,.floating-card-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:44px;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:400;font-size:18px;fill:#94a3b8}.badge-text,.floating-card-text{font-weight:600;font-size:13px;fill:#38bdf8}.floating-card-text{fill:#e2e8f0}.pulse-circle{animation:pulse 4s ease-in-out infinite alternate}</style><rect width="100%" height="100%" fill="url(#bgGrad)" rx="16"/><g transform="translate(1050, 60)"><circle cx="0" cy="0" r="140" fill="#00f2fe" class="pulse-circle" filter="url(#glowSoft)" opacity=".12"/></g><g transform="translate(150, 300)"><circle cx="0" cy="0"